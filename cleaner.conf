################################################################################
# fuck-cleanmymac Configuration File
# Location: ~/.config/fuck-cleanmymac/cleaner.conf
#
# This file controls the behavior of cleaner.sh
# Uncomment and modify settings as needed
################################################################################

# ============================================================================
# LOGGING CONFIGURATION
# ============================================================================

# Directory for log files (default: ~/.scripts/logs)
# LOG_DIR="$HOME/.scripts/logs"

# Log retention period in days (default: 90)
# Old logs will be automatically deleted
# LOG_RETENTION_DAYS=90

# ============================================================================
# CLEANING TARGETS
# ============================================================================

# Enable/disable cleaning of different categories
# Set to true/false to enable/disable

# System caches
CLEAN_SYSTEM_CACHES=true

# Application caches (Cursor, Notion, Slack, Telegram, JetBrains, etc.)
CLEAN_APP_CACHES=true

# Package manager caches (npm, yarn, brew, pip, gem)
CLEAN_PACKAGE_MANAGERS=true

# Browser caches
CLEAN_BROWSER_CACHES=true

# Trash
CLEAN_TRASH=true

# Temporary files
CLEAN_TEMP_FILES=true

# Docker system cleanup
CLEAN_DOCKER=true

# ============================================================================
# SAFE DELETION OPTIONS
# ============================================================================

# Paths that are ALWAYS allowed for cleaning (additional to defaults)
# Format: space-separated list of paths with ~ or $HOME
# ALLOWED_PATHS="$HOME/Downloads/temp $HOME/projects/build"

# Paths to EXCLUDE from cleaning (will be skipped)
# Format: space-separated list of paths
# EXCLUDE_PATHS="$HOME/Library/Application Support/Important $HOME/Documents/Work"

# ============================================================================
# NOTIFICATION SETTINGS
# ============================================================================

# Enable/disable notifications after cleaning
# ENABLE_NOTIFICATIONS=true

# Show summary in console output
# SHOW_SUMMARY=true

# ============================================================================
# ADVANCED OPTIONS
# ============================================================================

# Maximum depth for directory traversal (prevents accidental deep cleanup)
# MAX_DEPTH=3

# Minimum file age in days before deletion (safety measure)
# MIN_FILE_AGE_DAYS=7

# Enable detailed logging (verbose output)
# VERBOSE_MODE=false

# ============================================================================
# SAFE REMOVAL VALIDATION
# ============================================================================

# Validate paths before deletion (recommended: true)
# VALIDATE_PATHS=true

# Canonical path check (use realpath for validation)
# USE_REALPATH=true
