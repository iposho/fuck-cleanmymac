################################################################################
# fuck-cleanmymac Configuration File
# Location: ~/.config/fuck-cleanmymac/cleaner.conf
#
# This file controls the behavior of cleaner.sh
# Uncomment and modify settings as needed
################################################################################

# ============================================================================
# LOGGING CONFIGURATION
# ============================================================================

# Directory for log files (default: ~/.scripts/logs)
# LOG_DIR="$HOME/.scripts/logs"

# Log retention period in days (default: 90)
# Old logs will be automatically deleted
# LOG_RETENTION_DAYS=90

# ============================================================================
# CLEANING TARGETS
# ============================================================================

# Enable/disable cleaning of different categories
# Set to true/false to enable/disable

# System caches
CLEAN_SYSTEM_CACHES=true

# Application caches (Cursor, VS Code, Windsurf, Slack, Notion, Discord, Figma, Telegram media,
# Spotify, JetBrains, Zed, etc.)
CLEAN_APP_CACHES=true

# Package manager & developer caches (npm, yarn, pnpm, bun, brew, pip, cargo,
# Xcode DerivedData, simulator caches)
CLEAN_PACKAGE_MANAGERS=true

# Browser caches for every profile (Chrome, Arc, Brave, Edge, Firefox). Cookies and history are kept.
CLEAN_BROWSER_CACHES=true

# Trash
CLEAN_TRASH=true

# Temporary files (/tmp, /var/tmp): only your own entries older than TEMP_FILE_AGE_DAYS.
# Sockets (ssh-agent, tmux) and files of running programs are left alone.
CLEAN_TEMP_FILES=true
# TEMP_FILE_AGE_DAYS=2

# Docker: unused images, stopped containers, build cache, anonymous volumes
# (named volumes are kept). Skipped when Docker is not running.
CLEAN_DOCKER=true

# ============================================================================
# NOTIFICATION SETTINGS
# ============================================================================

# Show macOS notification after cleaning (default: true)
# SHOW_NOTIFICATION=true

# ============================================================================
# ADVANCED OPTIONS
# ============================================================================

# Enable detailed logging (verbose output)
# VERBOSE_MODE=false

# Validate paths before deletion (recommended: true)
# VALIDATE_PATHS=true
